<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/estils.css">
    <title>Formulari d'alta</title>
</head>
<body>
    <header>
        <h1 class="titulo">Formulari d'alta</h1>
        <nav>
            <ul class="menu">
                <li class="menu-item"><a href="index.html" target="_blank">Home</a></li>
                <li class="menu-item"><a href="festivales.html" target="_blank">Festivales</a></li>
                <li class="menu-item"><a href="detalle.html" target="_blank">Detalles</a></li>
                <li class="menu-item"><a href="alta.html">Darse de Alta</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <form>
                <h4>Datos Personales</h4>
                <label>Nombre:</label>
                <input type="text">

                <label>Correo electrónico:</label>
                <input type="email">

                <label>Contraseña:</label>
                <input type="password">

                <h4>Preferencias Musicales</h4>
                <label>Género favorito:</label>
                <select>
                    <option>Selecciona un género</option>
                    <option>Rock</option>
                    <option>Pop</option>
                    <option>Jazz</option>
                    <option>Electrónica</option>
                </select>
                <label><input type="checkbox">Deseo recibir noticias y novedades</label>
            <br>
            <button type="submit">Registrarse</button>
        </form>
</main>
<hr>
<footer>
    <p>Sígueme en: Linkedin · Github</p>

</footer>
